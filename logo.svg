<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3f93ff" />
      <stop offset="50%" style="stop-color:#2b7de9" />
      <stop offset="100%" style="stop-color:#1a6dd4" />
    </linearGradient>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff" />
      <stop offset="100%" style="stop-color:#c8e2ff" />
    </linearGradient>
  </defs>
  <!-- Círculo principal azul sólido -->
  <circle cx="100" cy="100" r="92" fill="url(#circleGrad)" />
  <!-- Anillo exterior sutil -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <!-- Anillo interior decorativo -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Letra V (estilizada, más gruesa y moderna) -->
  <path d="M 64 52 L 100 128 L 136 52" fill="none" stroke="url(#vGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Segunda línea V más fina para efecto 3D -->
  <path d="M 70 58 L 100 122 L 130 58" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Acentos decorativos pequeños -->
  <circle cx="40" cy="40" r="2" fill="rgba(255,255,255,0.2)"/>
  <circle cx="160" cy="40" r="2" fill="rgba(255,255,255,0.2)"/>
  <circle cx="40" cy="160" r="1.5" fill="rgba(255,255,255,0.12)"/>
  <circle cx="160" cy="160" r="1.5" fill="rgba(255,255,255,0.12)"/>
</svg>
